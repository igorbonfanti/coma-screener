name: Update data

on:
  schedule:
    - cron: '30 5 * * 1'   # ogni lunedi 05:30 UTC
  workflow_dispatch:
    inputs:
      force_factors:
        description: 'Riscarica i fattori anche se le fonti non sono cambiate'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # I fattori (French, AQR) escono una volta al mese: lo script interroga le
      # fonti con una HEAD e scarica solo se qualcosa e cambiato, quindi girare
      # ogni settimana costa quattro richieste. Se fallisce non deve impedire
      # l'aggiornamento dei prezzi, che e il cuore del progetto: il passo resta
      # segnalato nel log senza fermare il resto.
      - name: Aggiorna i fattori per l'attribuzione (solo se cambiati)
        continue-on-error: true
        run: node scripts/factors.js ${{ inputs.force_factors && '--force' || '' }}

      - name: Rigenera dataset (S&P500 + NASDAQ + NYSE)
        run: node scripts/fetch_data.js SP500 NASDAQ NYSE

      - name: Commit dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessun cambiamento nei dati."
          else
            git commit -m "chore: refresh settimanale dati"
            git push
          fi
